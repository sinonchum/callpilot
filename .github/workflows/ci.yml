name: ci

on:
  push:
  pull_request:

jobs:
  mock-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install laptop package
        run: python -m pip install -e "./laptop[dev]"
      - name: Unit tests
        working-directory: laptop
        run: python -m pytest
      - name: Mock end-to-end demo
        working-directory: laptop
        run: python -m orchestrator.demo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Panel tests and build
        working-directory: panel
        run: npm ci && npm test && npm run build
